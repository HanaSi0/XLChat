name: Publish verified plugin packages
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.8
permissions:
  contents: write
concurrency:
  group: xlchat-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check package hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Check Dalamud repository and release version
        run: |
          python3 tools/repository.py --check
          python3 - <<'PY'
          import json, os, zipfile
          with zipfile.ZipFile('dist/XLChat.zip') as archive:
              version = json.loads(archive.read('XLChat.json'))['AssemblyVersion']
          assert os.environ['RELEASE_TAG'] == 'v' + version.removesuffix('.0'), 'Release tag must match package version'
          PY
      - name: Upload packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json tagName --jq '.tagName'; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "XLChat $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/XLChat.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
