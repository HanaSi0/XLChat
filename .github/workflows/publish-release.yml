name: Publish verified plugin packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.2
permissions:
  contents: write
concurrency:
  group: xlchat-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check package hashes
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Check Dalamud repository
        run: python3 tools/repository.py --check
      - name: Upload packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' | grep -Fx "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/XLChat.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
