<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLinUI 0.1.0 素材预览</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#f2f7ff;background:#151e27}main{display:grid;grid-template-columns:310px 1fr;min-height:100vh}aside{background:#111921;padding:24px;overflow:auto}h1{font-size:22px;margin:0 0 8px}p{color:#c3cfda;line-height:1.7}label{display:block;margin:18px 0 7px}input,select,button{width:100%;padding:9px;background:#263442;border:1px solid #506173;border-radius:5px;color:inherit}input[type=color]{height:38px}input[type=range]{padding:0}small{display:block;color:#b1c2d2;line-height:1.6;margin-top:12px}.scene{position:relative;overflow:hidden;background:linear-gradient(145deg,#233b50 15%,#63848b 40%,#a9ac8d 52%,#354f57 53%,#223b49 72%,#0c1f2a)}.scene:before{content:'';position:absolute;inset:15% -10% 0;background:linear-gradient(135deg,transparent 25%,#132f3c 25%,#45606a 40%,transparent 40%),linear-gradient(40deg,transparent 30%,#21434b 30%,#4f7372 60%,transparent 60%);clip-path:polygon(0 50%,15% 35%,25% 50%,45% 0,65% 40%,80% 15%,100% 50%,100% 100%,0 100%)}.toolbar{position:absolute;top:0;left:0;right:0;text-align:center;padding:15px;background:#12223099;backdrop-filter:blur(10px);word-spacing:16px}.chat{position:absolute;left:6%;top:25%;width:min(700px,90%);height:450px;resize:both;overflow:hidden;min-width:330px;min-height:240px;border:1px solid #cad8ea40;border-radius:10px;box-shadow:0 18px 60px #0004;display:flex;color:var(--text,#f2f7ff)}.surface{position:absolute;inset:0;pointer-events:none;z-index:0;background-color:var(--solid,#142332);opacity:var(--opacity,.85)}.image{position:absolute;inset:-45px;background-size:cover;background-position:center;filter:blur(var(--blur,10px));display:none}.tint{position:absolute;inset:0;background:var(--solid,#142332);opacity:var(--tint,.35)}nav,.feed{position:relative;z-index:1}nav{width:120px;padding:15px 10px;border-right:1px solid #bed3e029;flex-shrink:0}nav button{border:0;background:none;text-align:left;margin-bottom:6px}nav button:first-child{background:var(--accent,#488eb6);color:#fff}.feed{padding:20px;display:flex;flex-direction:column;flex:1;min-width:0}.message{line-height:1.75;margin-bottom:18px;font-size:var(--font,15px)}.meta{color:#addef1;font-size:.85em;margin-bottom:3px}.composer{margin-top:auto;display:flex;gap:8px}.composer input{background:#12223066;border-color:#cbddea40}.composer button{width:70px;background:var(--accent,#488eb6);border:0}.caption{position:absolute;bottom:25px;left:6%;color:#fff;text-shadow:0 1px 4px #000}.glass .surface{background:transparent;backdrop-filter:blur(var(--blur,10px))}.picture .image{display:block}.solid .tint{display:none}.transparent .surface{display:none}@media(max-width:900px){main{grid-template-columns:260px 1fr}nav{width:85px}.chat{height:500px}.feed{padding:12px}}
</style><main><aside><h1>XLinUI <span style="color:#93c9e8">0.1.0</span></h1><p>背景 · 颜色 · 本机字体<br>无标题栏，可拖动右下角调整宽窄。</p><label>背景模式</label><select id="mode"><option value="glass">模糊玻璃</option><option value="picture">导入图片</option><option value="solid">纯色</option><option value="transparent">透明</option></select><label>背景图片（本机）</label><input type="file" id="image" accept=".png,.jpg,.jpeg,.bmp"><label>背景不透明度</label><input id="opacity" type="range" min="0" max="1" step=".01" value=".85"><label>模糊强度</label><input id="blur" type="range" min="0" max="32" value="12"><label>背景／玻璃色</label><input id="color" type="color" value="#142332"><label>颜色覆盖</label><input id="tint" type="range" min="0" max="1" step=".01" value=".35"><label>文字颜色</label><input id="text" type="color" value="#f2f7ff"><label>强调色</label><input id="accent" type="color" value="#488eb6"><label>本机字体</label><input id="font" type="file" accept=".ttf,.otf,.ttc"><label>预览字号</label><input id="fontSize" type="range" min="12" max="30" value="15"><button id="reset" style="margin-top:20px">恢复默认字体</button><small id="notice">浏览器视觉演示，不连接 FF14。游戏内玻璃采用主画面采样，默认每秒 2 次。此处使用 CSS 模糊；浏览器可能不支持 TTC 字体。</small></aside><section class="scene"><div class="toolbar">特效 职业 装备 金币 任务 传送 地图 插件 指令</div><div class="chat glass" id="chat"><div class="surface"><div class="image" id="background"></div><div class="tint"></div></div><nav><button>全部</button><button>小队</button><button>社交</button><button>私信</button><button>系统</button></nav><div class="feed"><div class="message"><div class="meta">小队 · 星河　20:45</div>准备好了，下一轮一起出发。<br>这次试试简洁的玻璃背景。</div><div class="message"><div class="meta">部队 · 林　20:46</div>图片、颜色和字体都可以用自己喜欢的。<br>聊天的大小与频道布局继续独立设置。</div><div class="message"><div class="meta">系统　20:47</div>本页消息与山景为演示内容。</div><div class="composer"><input placeholder="输入消息…（演示）"><button>发送</button></div></div></div><div class="caption">本机导入 · 独立颜色 · 简洁窗口</div></section></main><script>
const $=id=>document.getElementById(id),chat=$('chat');function update(){chat.className='chat '+$('mode').value;for(const k of ['opacity','tint','color','text','accent'])chat.style.setProperty('--'+(k==='color'?'solid':k),$(k).value);chat.style.setProperty('--blur',$('blur').value+'px');chat.style.setProperty('--font',$('fontSize').value+'px')}for(const id of ['mode','opacity','tint','color','text','accent','blur','fontSize'])$(id).oninput=update;let imageUrl=null,face=null;$('image').onchange=()=>{const f=$('image').files[0];if(!f)return;if(f.size>32*1024*1024){$('notice').textContent='图片超过 32 MB';return}if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);$('background').style.backgroundImage='url("'+imageUrl+'")';$('mode').value='picture';update()};$('font').onchange=async()=>{const f=$('font').files[0];if(!f)return;if(f.size>32*1024*1024){$('notice').textContent='字体超过 32 MB';return}try{const next=new FontFace('LocalPreview',await f.arrayBuffer());await next.load();if(face)document.fonts.delete(face);document.fonts.add(next);face=next;chat.style.fontFamily='LocalPreview,system-ui';$('notice').textContent='已导入 '+f.name+'；文件仅在本页内存中使用。'}catch{$('notice').textContent='浏览器无法读取该字体；仍使用默认字体。'}};$('reset').onclick=()=>{if(face)document.fonts.delete(face);face=null;chat.style.fontFamily='';$('font').value=''};update();
</script></html>
