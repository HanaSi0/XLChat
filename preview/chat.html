<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLinUI 0.1.0 · 聊天自定义预览</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100vh;width:100vw;overflow:hidden;color:#f4f9ff;font:15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;background:linear-gradient(140deg,#456873,#263f3d 48%,#355244);text-shadow:-1px 0 #10191e,1px 0 #10191e,0 1px #10191e,0 -1px #10191e}button,input,select{font:inherit;color:inherit;text-shadow:inherit}button{cursor:pointer;background:#ffffff08;border:0;padding:6px 10px}button:hover{background:#83d6c525}input,select{background:#0c172430;border:1px solid #ffffff20;border-radius:3px;padding:5px;outline:none}option{background:#243c3c}.muted{color:#d1dfe6;font-size:12px}h1{font-size:23px;font-weight:500;letter-spacing:2px;margin:0 0 7px}.intro{position:absolute;left:45px;top:35px}.intro p{font-size:12px;margin:7px 0;color:#c5d9dc}.controls{position:absolute;right:35px;top:40px;width:310px;max-height:calc(100vh -80px);overflow:auto;padding:15px;border-left:1px solid #ffffff20;font-size:12px}.controls h2{font-size:15px;font-weight:500;margin:0 0 12px}.controls label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:13px 0 5px}.controls input[type=range]{width:100%;accent-color:#87daca}.controls select{width:100%;font-size:12px}.controls details{border-bottom:1px solid #ffffff15;padding:10px 0}.controls summary{cursor:pointer;color:#a5e8d9}.controls output{color:#b3ebdf}.controls button{font-size:12px;margin-top:8px}.chat{position:absolute;left:45px;top:170px;width:760px;height:530px;display:flex;resize:both;overflow:hidden;min-width:320px;min-height:240px;max-width:calc(100vw -390px);max-height:calc(100vh -190px);padding:8px;--side:145px;--composer:120px;--font:15px;--item:30px;--gap:3px;--group:8px;--input:32px;--send:60px;--search:28px;--scroll:10px}.nav{width:var(--side);max-width:55%;flex-shrink:0;overflow:auto;font-size:var(--font)}.nav button{display:block;width:100%;text-align:left;height:var(--item);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav .selected{color:#a5ecda;background:#83d6c51c}.nav .add{font-size:12px;margin-top:12px;color:#d1e7e4}.vs{width:6px;cursor:ew-resize;flex-shrink:0}.vs:hover,.hs:hover{background:#d1edf540}.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:0 4px}.search{height:var(--search);margin-bottom:7px;flex-shrink:0;font-size:var(--font);width:100%}::placeholder{color:#c4d4db;opacity:1}.feed{flex:1;min-height:30px;overflow:auto;font-size:var(--font);scrollbar-width:thin;scrollbar-color:#a3bfbb66 transparent}.feed::-webkit-scrollbar{width:var(--scroll)}.feed::-webkit-scrollbar-thumb{background:#9ac7be66}.message{padding-bottom:var(--gap);margin-bottom:var(--group);line-height:1.7}.author{font-size:var(--font);color:#a6e6d6}.stamp{font-size:11px;color:#d0dfe9;margin-left:10px}.text{max-width:100%;overflow-wrap:anywhere}.hs{height:6px;cursor:ns-resize;flex-shrink:0}.composer{height:var(--composer);max-height:65%;flex-shrink:0;overflow:auto;font-size:var(--font);border-top:1px solid #ffffff10;padding-top:6px}.routeRow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.routeRow select{font-size:12px;width:110px}.routeRow label{font-size:12px}.inputRow{display:flex;gap:6px}.draft{flex:1;min-width:25px;height:var(--input)}.send{width:var(--send);height:var(--input);padding:0}.counter{font-size:10px;color:#b8cdd4;margin-top:6px}.notice{font-size:11px;color:#a7ecdd;margin-top:5px}.recipient{display:block;width:100%;margin-bottom:6px}.chat.right{flex-direction:row-reverse}.chat.tabs{flex-direction:column}.chat.tabs .nav{max-width:100%;height:40px;width:100%;display:flex;overflow-x:auto;flex-shrink:0;gap:8px}.chat.tabs .nav button{width:auto;flex-shrink:0}.chat.tabs .nav .add{margin:0}.chat.tabs .vs,.chat.none .nav,.chat.none .vs{display:none}.hint{position:absolute;left:45px;bottom:24px;font-size:11px;color:#c0d6d3}.context{position:absolute;padding:10px;background:#1b3336eb;border:1px solid #91afa833;font-size:12px;z-index:5}.context button{display:block;text-align:left;width:100%}.lock{resize:none}.light{background:linear-gradient(150deg,#a7c3ca,#699486 48%,#88a992)}
.noviceJoin{font-size:12px!important;padding:3px 6px!important;width:auto!important;flex-shrink:0}.routeRow{flex-wrap:wrap}</style><div class="intro"><h1>XLinUI · 聊天自定义</h1><p>0.1.0 交互预览 · 演示数据，非游戏截图</p><p>拖动两条分隔线调整宽窄和输入区高度；右下角缩放主窗，右键消息查看操作。</p></div><section class="chat" id="chat"><aside class="nav" id="nav"></aside><div class="vs" id="vsplit"></div><div class="main"><input class="search" id="search" placeholder="搜索发言人或消息…"><div class="feed" id="feed"></div><div class="hs" id="hsplit"></div><div class="composer"><div class="routeRow"><select id="route"><option>小队</option><option>说话</option><option>部队</option><option>团队</option><option>私信</option><option>回声</option></select><label><input type="checkbox" id="follow" checked> 跟随新消息</label><button class="noviceJoin" id="noviceJoin" title="游戏内执行加入请求；此页仅演示">加入新手频道</button></div><input class="recipient" id="recipient" placeholder="玩家名@世界名" hidden><div class="inputRow"><input class="draft" id="draft" placeholder="输入消息，Enter 发送（仅预览）"><button class="send" id="send">发送</button></div><div class="counter" id="counter">0 字节 · 发送到小队</div><div class="notice" id="notice"></div></div></div></section><aside class="controls"><h2>聊天布局 · 即时调整</h2><label>频道导航</label><select id="mode"><option value="left">左侧</option><option value="right">右侧</option><option value="tabs">顶部标签</option><option value="none">隐藏导航</option></select><div id="ranges"></div><details><summary>文字与显示</summary><label>格式</label><select id="format"><option value="grouped">社交分组</option><option value="compact">紧凑日志</option></select><label>时间戳<input id="time" type="checkbox" checked></label><label>显示搜索<input id="searchToggle" type="checkbox" checked></label><label>显示发送按钮<input id="sendToggle" type="checkbox" checked></label><label>显示加入新手频道按钮<input id="noviceToggle" type="checkbox" checked></label><label>主题色<input id="color" type="color" value="#a6e6d6"></label></details><details><summary>独立背景与布局档案</summary><label>背景模式</label><select id="bg"><option value="transparent">透明</option><option value="custom">自定义背景</option></select><label>不透明度</label><input id="opacity" type="range" min="0" max="100" value="30"><label>浅色场景<input id="light" type="checkbox"></label><label>锁定布局<input id="lock" type="checkbox"></label><input id="profileName" value="我的布局" style="width:100%"><button id="saveProfile">保存档案</button><button id="loadProfile">应用档案</button><button id="reset">恢复演示默认</button></details><p class="muted">此页不连接游戏。插件内频道来自游戏事件与 LogFilter；地图链接通过原生地图接口打开。</p></aside><div class="hint">主窗、导航、搜索、消息宽度、输入区、输入框、发送按钮、滚动条与间距均可调 · 窄窗会按可用空间适配</div><div class="context" id="context" hidden></div><script>
const $=s=>document.querySelector(s),chat=$('#chat');let category='全部',contextRow=null;const drafts={};let messages=[{sender:'系统',channel:'系统',time:'20:42',text:'欢迎来到薰衣草苗圃。'},{sender:'林间晚风',channel:'小队',time:'20:43',text:'准备好就出发吧。'},{sender:'月光',channel:'社交',time:'20:43',text:'今天一起打每日吗？'},{sender:'你',channel:'小队',time:'20:44',text:'稍等，我切一下职业。'},{sender:'林间晚风',channel:'小队',time:'20:44',text:'集合地点：薰衣草苗圃 (12.3, 8.6)。',map:true}];const defs=[['width','主窗宽度',320,1100,760],['height','主窗高度',240,680,530],['side','频道栏宽度',40,500,145],['composer','输入区高度',60,300,120],['input','输入框高度',24,100,32],['inputWidth','输入框宽度（0填满）',0,800,0],['send','发送按钮宽度',40,180,60],['search','搜索框高度',24,80,28],['font','消息字号',10,28,15],['messageWidth','消息最大宽度',120,800,600],['gap','消息间距',0,30,3],['group','分组间距',0,50,8],['item','频道行高度',20,80,30],['scroll','滚动条宽度',8,30,10]];const values={};const box=document.createElement('details');box.open=true;box.innerHTML='<summary>各区域大小、宽窄</summary>';$('#ranges').append(box);defs.forEach(([key,label,min,max,value])=>{values[key]=value;const l=document.createElement('label');l.textContent=label;const o=document.createElement('output');o.id='value-'+key;o.textContent=value;l.append(o);const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=value;input.id='range-'+key;input.oninput=()=>{values[key]=Number(input.value);apply()};box.append(l,input)});function apply(){defs.forEach(([key])=>{chat.style.setProperty('--'+key,values[key]+'px');$('#value-'+key).textContent=Math.round(values[key]);$('#range-'+key).value=values[key]});$('#draft').style.flex=values.inputWidth>0?'0 1 '+values.inputWidth+'px':'1';chat.style.width=values.width+'px';chat.style.height=values.height+'px';chat.className='chat '+$('#mode').value+($('#lock').checked?' lock':'');chat.style.resize=$('#lock').checked?'none':'both';chat.style.background=$('#bg').value==='custom'?`rgba(15,26,35,${$('#opacity').value/100})`:'transparent';$('#search').hidden=!$('#searchToggle').checked;$('#send').hidden=!$('#sendToggle').checked;$('#search').style.fontSize=values.font+'px';render()}
function render(){const feed=$('#feed');feed.replaceChildren();let last='';messages.filter(m=>(category==='全部'||m.channel===category)&&(m.sender+' '+m.text).toLowerCase().includes($('#search').value.toLowerCase())).forEach(m=>{const d=document.createElement('div');d.className='message';if($('#format').value==='compact'){d.textContent=($('#time').checked?m.time+' ':'')+'['+m.channel+'] '+m.sender+'：'+m.text}else{if(last!==m.sender+'|'+m.channel){const a=document.createElement('div');a.className='author';a.style.color=$('#color').value;a.textContent=m.sender;const t=document.createElement('span');t.className='stamp';t.textContent=m.channel+($('#time').checked?' · '+m.time:'');a.append(t);d.append(a)}const text=document.createElement('div');text.className='text';text.style.maxWidth=values.messageWidth+'px';text.textContent=m.text;d.append(text)}d.oncontextmenu=e=>{e.preventDefault();contextRow=m;showContext(e.clientX,e.clientY)};feed.append(d);last=m.sender+'|'+m.channel});if($('#follow').checked)feed.scrollTop=feed.scrollHeight}
function selectCategory(name){drafts[category]=$('#draft').value;category=name;$('#draft').value=drafts[name]||'';Array.from($('#nav').querySelectorAll('button')).forEach(b=>b.classList.toggle('selected',b.textContent===name));render();counter()}
['全部','小队','社交','私信','系统'].forEach(name=>{const b=document.createElement('button');b.textContent=name;b.className=name===category?'selected':'';b.onclick=()=>selectCategory(name);$('#nav').append(b)});const add=document.createElement('button');add.className='add';add.textContent='+ 添加分类';add.onclick=()=>{const name=prompt('演示分类名称');if(name){const b=document.createElement('button');b.textContent=name;b.onclick=()=>selectCategory(name);$('#nav').insertBefore(b,add)}};$('#nav').append(add);
function counter(){$('#counter').textContent=new TextEncoder().encode($('#draft').value).length+' 字节 · 发送到'+$('#route').value;$('#recipient').hidden=$('#route').value!=='私信'}function send(){const text=$('#draft').value.trim();if(!text)return;if($('#route').value==='私信'&&!$('#recipient').value.includes('@')){$('#notice').textContent='请填写 玩家名@世界名';return}if(new TextEncoder().encode(text).length>450){$('#notice').textContent='消息过长';return}messages.push({sender:'你',channel:$('#route').value==='部队'?'社交':$('#route').value,time:'20:45',text});$('#draft').value='';drafts[category]='';$('#notice').textContent='已加入演示消息；未发送到游戏。';counter();render()}$('#draft').oninput=counter;$('#draft').onkeydown=e=>{if(e.key==='Enter')send()};$('#send').onclick=send;$('#route').onchange=counter;$('#search').oninput=render;['mode','bg','opacity','format','time','searchToggle','sendToggle','color','lock'].forEach(id=>$('#'+id).onchange=apply);$('#light').onchange=e=>document.body.classList.toggle('light',e.target.checked);
let dragging=null;function start(e,type){if($('#lock').checked)return;e.preventDefault();dragging={type,x:e.clientX,y:e.clientY,start:values[type]};e.target.setPointerCapture(e.pointerId)}$('#vsplit').onpointerdown=e=>start(e,'side');$('#hsplit').onpointerdown=e=>start(e,'composer');window.addEventListener('pointermove',e=>{if(!dragging)return;const {type,x,y,start}=dragging;const delta=type==='side'?(e.clientX-x)*($('#mode').value==='right'?-1:1):y-e.clientY;const def=defs.find(d=>d[0]===type);values[type]=Math.max(def[2],Math.min(def[3],start+delta));apply()});window.addEventListener('pointerup',()=>dragging=null);
function showContext(x,y){const c=$('#context');c.replaceChildren();[['复制消息',()=>{navigator.clipboard?.writeText(contextRow.text).catch(()=>{});$('#notice').textContent='复制操作仅针对演示消息。'}],['引用到输入框',()=>{$('#draft').value='「'+contextRow.text+'」 ';counter()}],['私信此玩家',()=>{$('#route').value='私信';$('#recipient').value=contextRow.sender+'@演示世界';counter()}],['地图位置（演示）',()=>$('#notice').textContent='游戏内由原生地图接口打开；此页不连接游戏。']].forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();c.hidden=true};c.append(b)});c.style.left=Math.min(x,innerWidth-230)+'px';c.style.top=Math.min(y,innerHeight-160)+'px';c.hidden=false}window.addEventListener('click',e=>{if(!$('#context').contains(e.target))$('#context').hidden=true});let profiles={};try{profiles=JSON.parse(localStorage.getItem('xlin-chat-demo-profiles')||'{}')}catch{}$('#saveProfile').onclick=()=>{profiles[$('#profileName').value]= {values:{...values},mode:$('#mode').value,bg:$('#bg').value,opacity:$('#opacity').value,format:$('#format').value};try{localStorage.setItem('xlin-chat-demo-profiles',JSON.stringify(profiles))}catch{}$('#notice').textContent='已保存演示布局档案。'};$('#loadProfile').onclick=()=>{const p=profiles[$('#profileName').value];if(!p){$('#notice').textContent='没有此档案';return}defs.forEach(([k,,min,max])=>{if(Number.isFinite(p.values[k]))values[k]=Math.max(min,Math.min(max,p.values[k]))});['mode','bg','opacity','format'].forEach(k=>$('#'+k).value=p[k]);apply();$('#notice').textContent='已应用演示布局档案。'};$('#reset').onclick=()=>{defs.forEach(([k,,,,v])=>values[k]=v);$('#mode').value='left';$('#bg').value='transparent';$('#format').value='grouped';apply()};new ResizeObserver(()=>{values.width=chat.offsetWidth;values.height=chat.offsetHeight;['width','height'].forEach(k=>{$('#value-'+k).textContent=Math.round(values[k]);$('#range-'+k).value=values[k]})}).observe(chat);apply();
$('#noviceToggle').onchange=()=>$('#noviceJoin').hidden=!$('#noviceToggle').checked;$('#noviceJoin').onclick=()=>{$('#noviceJoin').textContent='已加入（演示）';$('#noviceJoin').disabled=true;$('#notice').textContent='此页仅演示按钮状态，未向游戏提交加入请求。'};</script></html>
