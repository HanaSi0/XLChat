<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XLinUI 0.10.0 顶部栏预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c29;color:#eef6ff;font:15px system-ui}#scene{height:280px;position:relative;background:linear-gradient(120deg,#2f4d59,#72908d 60%,#42566b);overflow:hidden}#scene:after{content:'';position:absolute;inset:75px 0 0;background:linear-gradient(145deg,transparent 35%,#19313e55 35%,#35566a88 55%,transparent 55%);pointer-events:none}#top{position:relative;z-index:2;background:#12202ddd;backdrop-filter:blur(12px);border-bottom:1px solid #cee3ff29}#top button{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;background:transparent;color:#f5f8ff;font:inherit;overflow:hidden;white-space:nowrap;border-radius:4px}#top button:hover{background:#5492b64d}#top button span{overflow:hidden;text-overflow:ellipsis}svg{width:20px;height:20px;flex-shrink:0;stroke:#b9e7ff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.caption{position:absolute;top:140px;left:4%;z-index:1;color:#eef8ff;text-shadow:0 1px 3px #173341}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7;color:#c9d9e8}main{padding:28px 4%;max-width:1600px;margin:auto}.controls{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px}.control{background:#1c2a38;border:1px solid #9cbfdb26;padding:12px;border-radius:6px;display:flex;align-items:center;gap:10px}.control label{display:flex;gap:5px;align-items:center}.name{min-width:90px;flex:1}.pinned{color:#a2d9f4;font-size:13px}input{accent-color:#65b9e8}.legend{display:flex;gap:24px;margin:20px 0;color:#c9e5f8}small{color:#a5bdcf;line-height:1.7;display:block;margin-top:25px}@media(max-width:1000px){.controls{grid-template-columns:repeat(2,minmax(150px,1fr))}}
</style><section id="scene"><div id="top"></div><div class="caption"><h1>XLinUI 0.10.0 · 图标顶部栏</h1>快捷入口均匀展开，常用信息独立靠右。窄屏自动分行，完整名称可悬停查看。</div></section><main><div class="legend"><label><input id="icons" type="checkbox" checked> 显示图标</label><label><input id="border" type="checkbox" checked> 显示分隔边框</label><span id="info"></span></div><div id="controls" class="controls"></div><small>浏览器交互预览，山景和状态数值均为演示。这里使用示意线条图标；游戏内优先读取职业、在线状态、货币、背包、任务、地图、传送等原生图标，缺失时回退内置图标。取消“显示”后，右侧常驻项目也会隐藏。</small></main><script>
const shapes={magic:'M12 3v4m0 10v4M3 12h4m10 0h4M6 6l3 3m6 6l3 3M6 18l3-3m6-6l3-3',users:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6m8-1a2.5 2.5 0 1 0 0-5M2 20v-3c0-5 12-5 12 0v3m3-7c3 0 5 1 5 4v3',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21v-3c0-6 16-6 16 0v3',job:'M5 4h14v9c0 5-7 8-7 8s-7-3-7-8zM12 7v10m-4-5h8',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2',coin:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M15 7h-4a3 3 0 0 0 0 6h2a3 3 0 0 1 0 6H9m3-14v16',bolt:'M13 2 4 14h7l-1 8 10-13h-7z',map:'m2 5 6-3 8 3 6-3v17l-6 3-8-3-6 3zM8 2v17m8-14v17',plugin:'M5 5h5V2h4v3h5v5h3v4h-3v5h-5v3h-4v-3H5v-5H2v-4h3z',terminal:'m4 6 6 6-6 6m9 0h7',bag:'M4 7h16l1 14H3zM8 7V5a4 4 0 0 1 8 0v2',quest:'M5 3h14v18H5zM8 7h8m-8 5h8m-8 5h5',globe:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2c-6 6-6 14 0 20m0-20c6 6 6 14 0 20',fps:'M3 20V4m0 16h19M6 16l5-6 4 3 6-8',sound:'M3 9h4l5-5v16l-5-5H3zM16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14',lock:'M5 10h14v12H5zM8 10V5a4 4 0 0 1 8 0v5',settings:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',hammer:'m5 21 11-11m-4-6 4-2 6 6-2 4-8-8M3 19l2 2'};
const items=[['特效','magic'],['部族','users'],['在线','user'],['99% / 100%','hammer',true],['武士','job'],['雇员','clock'],['金币 4,077,163','coin',true],['传送面板','bolt'],['薰衣草苗圃','map'],['插件收纳 18','plugin'],['指令收纳','terminal'],['背包','bag'],['任务','quest'],['区域 340 / 地图 193 / 天气 2','globe'],['FPS 128','fps',true],['AI：关','plugin'],['音量 33%','sound',true],['LT 04:52 / ET 08:03','clock',true],['锁定布局','lock'],['游戏功能','settings'],['设置','settings'],['隐藏原版 UI','eye']].map(([label,icon,pin=false])=>({label,icon,pin,show:true}));const $=id=>document.getElementById(id),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font='15px system-ui';function arrange(){const available=Math.max(1,innerWidth-16),gap=8,left=items.filter(i=>i.show&&!i.pin),right=items.filter(i=>i.show&&i.pin),showIcons=$('icons').checked;const measure=i=>Math.min(ctx.measureText(i.label).width,180)+16+3+(showIcons?26:0);const limit=left.length?available*.48:available;let rr=[],row=[],used=0;for(const i of right){const w=Math.min(measure(i),limit);if(row.length&&used+gap+w>limit){rr.push(row);row=[];used=0}if(row.length)used+=gap;row.push([i,w]);used+=w}if(row.length)rr.push(row);const rw=rr.length?Math.max(...rr.map(r=>r.reduce((s,x)=>s+x[1],0)+gap*(r.length-1))):0,lw=Math.max(1,available-rw-(rw&&left.length?gap:0)),widest=left.length?left.map(measure).sort((a,b)=>a-b)[Math.floor(left.length/2)]:1,cols=Math.max(1,Math.floor((lw+gap)/(widest+gap))),slots=[];let rows=0;for(let start=0;start<left.length;start+=cols){const count=Math.min(cols,left.length-start),cell=(lw-gap*(count-1))/count;for(let n=0;n<count;n++)slots.push([left[start+n],n*(cell+gap),cell,rows]);rows++}rr.forEach((r,n)=>{let x=available-r.reduce((s,i)=>s+i[1],0)-gap*(r.length-1);r.forEach(([i,w])=>{slots.push([i,x,w,n]);x+=w+gap})});$('top').style.height=(Math.max(rows,rr.length,1)*34+8)+'px';$('top').replaceChildren();for(const [i,x,w,n] of slots){const b=document.createElement('button');b.title=i.label+(i.pin?' · 右侧常驻':'');b.style.cssText=`left:${8+x}px;top:${4+n*34}px;width:${w}px;height:34px`;if(showIcons)b.innerHTML=`<svg viewBox="0 0 24 24"><path d="${shapes[i.icon]}"/></svg>`;const t=document.createElement('span');t.textContent=i.label;b.append(t);$('top').append(b)}$('info').textContent='当前 '+items.filter(i=>i.show).length+' 项 · '+Math.max(rows,rr.length,1)+' 行'}for(const i of items){const c=document.createElement('div');c.className='control';const name=document.createElement('span');name.className='name';name.textContent=i.label;c.append(name);for(const [key,label]of [['show','显示'],['pin','右侧']]){const l=document.createElement('label');if(key==='pin')l.className='pinned';const input=document.createElement('input');input.type='checkbox';input.checked=i[key];input.onchange=()=>{i[key]=input.checked;arrange()};l.append(input,label);c.append(l)}$('controls').append(c)}$('icons').onchange=arrange;$('border').onchange=()=>{$('top').style.borderBottomColor=$('border').checked?'#cee3ff29':'transparent'};window.onresize=arrange;arrange();
</script></html>
