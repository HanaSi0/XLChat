<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>XLinUI 0.11.1 多热键栏预览</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:#f3f8ff;font:15px system-ui;background:#132536}main{display:grid;grid-template-columns:310px 1fr;height:100vh}aside{padding:22px;background:#111d29;overflow:auto}h1{font-size:24px;margin:0}p{line-height:1.7;color:#c0d4e5}label{display:block;margin:18px 0 8px}select,input,button{background:#253a4d;border:1px solid #53738d;color:inherit;padding:8px;border-radius:4px}select,input[type=range]{width:100%}input[type=checkbox]{accent-color:#77cced}button{cursor:pointer}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.skill{display:grid;place-items:center;height:46px;border:1px solid #b1dbff88;background:linear-gradient(145deg,#4486a3,#314257);font-size:19px;cursor:grab}.skill:nth-child(2n){background:linear-gradient(145deg,#ab854b,#413247)}#scene{position:relative;overflow:hidden;background:linear-gradient(140deg,#345269,#688686 50%,#223b53)}#scene:before{content:'';position:absolute;inset:100px 0 0;background:#243f5755;clip-path:polygon(0 75%,20% 25%,35% 55%,70% 0,100% 45%,100% 100%,0 100%)}#grid{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(#97d4ff40 1px,transparent 1px),linear-gradient(90deg,#97d4ff40 1px,transparent 1px);background-size:16px 16px}.caption{position:absolute;top:35px;left:4%;text-shadow:0 1px 3px #173341}.bar{position:absolute;display:grid;grid-template-columns:repeat(var(--cols),40px);gap:3px;padding:3px;transform-origin:top left;border:1px solid #c1eaff88}.bar.selected{border-color:#96e6ff}.slot{width:40px;height:40px;background:#122a4288;border:1px solid #a6c4e166;color:#fff;display:grid;place-items:center;font-size:20px;position:relative;text-shadow:0 1px 3px #000}.slot em{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;color:#d7e4ed}.handle{position:absolute;left:0;top:-26px;background:#162a3ee8;color:#e7f5ff;font-size:12px;padding:4px 8px;min-width:95px;cursor:move;border:1px solid #7ac7ec77;user-select:none}#notice{margin-top:20px;font-size:13px;color:#bcd5e8;line-height:1.8}.foot{position:absolute;bottom:30px;left:4%;color:#dcecff;text-shadow:0 1px 3px #000}
</style><main><aside><h1>XLinUI <span style="color:#a4def9">0.11.1</span></h1><p>多热键栏 · 自由位置与缩放<br>Shift 网格吸附，Ctrl 多选。</p><button id="openEditor">打开编辑模式</button><section id="editMenu" hidden><h2 style="font-size:18px;margin-top:22px">热键栏编辑 · 二级菜单</h2><button id="finishEditor">完成编辑</button><label>选择热键栏</label><select id="selected"><option>热键栏 1</option><option>热键栏 2</option><option>热键栏 3</option></select><label>独立缩放</label><input id="scale" type="range" min="50" max="200" value="100"><label>排列（预览示意）</label><select id="shape"><option value="12">12 × 1</option><option value="6">6 × 2</option><option value="4">4 × 3</option><option value="3">3 × 4</option><option value="2">2 × 6</option><option value="1">1 × 12</option></select><label>吸附网格</label><input id="step" type="range" min="4" max="64" value="16"><label>技能与特性 · 拖入格子</label><div class="skills" id="skills"></div></section><div id="notice">浏览器功能演示，不连接 FF14。游戏内使用原生技能格和拖放；横竖排列通过原版 HUD 编辑器设置。本页图标为示意符号。</div></aside><section id="scene"><div id="grid"></div><div class="caption"><h1>热键栏保持原生交互</h1><p>独立拖柄 · 连续缩放 · 从技能列表拖入<br>拖动时按住 Shift，可在网格上精确定位。</p></div><div class="foot">多个热键栏分别调整，原生键位、冷却和提示继续保留。</div></section></main><script>
const $=id=>document.getElementById(id),scene=$('scene'),symbols=['✦','⚔','✧','☄','❖','➶','✺','☀'];let selected=new Set([0]),drag=null,editing=false;const bars=[{x:65,y:360,scale:1,cols:12},{x:65,y:460,scale:1,cols:12},{x:640,y:290,scale:1.15,cols:3}];let active=0;for(const symbol of symbols){const el=document.createElement('div');el.className='skill';el.textContent=symbol;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('text/plain',symbol);$('skills').append(el)}function fit(bar){bar.x=Math.max(0,Math.min(bar.x,scene.clientWidth-(bar.cols*43+6)*bar.scale));bar.y=Math.max(30,Math.min(bar.y,scene.clientHeight-(Math.ceil(12/bar.cols)*43+6)*bar.scale))}function apply(){bars.forEach((b,i)=>{fit(b);b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';b.el.style.transform='scale('+b.scale+')';b.el.style.setProperty('--cols',b.cols);b.el.classList.toggle('selected',editing&&selected.has(i));b.handle.hidden=!editing});$('scale').value=bars[active].scale*100;$('shape').value=bars[active].cols;$('selected').selectedIndex=active;const step=$('step').value;$('grid').style.backgroundSize=step+'px '+step+'px'}bars.forEach((bar,i)=>{const el=document.createElement('div');el.className='bar';bar.el=el;const handle=document.createElement('div');bar.handle=handle;handle.className='handle';handle.textContent='栏 '+(i+1)+' · 拖动';handle.onpointerdown=e=>{if(e.ctrlKey){if(selected.has(i))selected.delete(i);else selected.add(i)}else if(!selected.has(i))selected=new Set([i]);active=i;drag={x:e.clientX,y:e.clientY,origins:new Map([...selected].map(n=>[n,{x:bars[n].x,y:bars[n].y}])),anchor:i};handle.setPointerCapture(e.pointerId);apply()};el.append(handle);for(let n=0;n<12;n++){const slot=document.createElement('div');slot.className='slot';slot.innerHTML='<em>'+((n+1)%10)+'</em><span>'+symbols[(i*3+n)%symbols.length]+'</span>';slot.ondragover=e=>{e.preventDefault();slot.style.borderColor='#92efff'};slot.ondragleave=()=>slot.style.borderColor='';slot.ondrop=e=>{e.preventDefault();const symbol=e.dataTransfer.getData('text/plain');if(symbols.includes(symbol)){slot.querySelector('span').textContent=symbol;$('notice').textContent='已放入演示格子；游戏内拖放由原生窗口处理。'}slot.style.borderColor=''};el.append(slot)}scene.append(el)});window.onpointermove=e=>{if(!drag||!editing)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;const base=drag.origins.get(drag.anchor),step=+$('step').value;if(e.shiftKey&&base){dx=Math.round((base.x+dx)/step)*step-base.x;dy=Math.round((base.y+dy)/step)*step-base.y}drag.origins.forEach((p,n)=>{bars[n].x=p.x+dx;bars[n].y=p.y+dy});$('grid').style.display=e.shiftKey?'block':'none';apply()};window.onpointerup=()=>{drag=null;$('grid').style.display='none'};window.onkeydown=e=>{if(e.key==='Shift'&&editing)$('grid').style.display='block'};window.onkeyup=e=>{if(e.key==='Shift')$('grid').style.display='none'};$('selected').onchange=()=>{active=$('selected').selectedIndex;selected=new Set([active]);apply()};$('scale').oninput=()=>{bars[active].scale=$('scale').value/100;apply()};$('shape').onchange=()=>{bars[active].cols=+$('shape').value;apply()};$('step').oninput=apply;$('openEditor').onclick=()=>{editing=true;$('editMenu').hidden=false;$('openEditor').hidden=true;apply()};$('finishEditor').onclick=()=>{editing=false;drag=null;$('grid').style.display='none';$('editMenu').hidden=true;$('openEditor').hidden=false;apply()};window.onresize=apply;apply();
</script></html>
